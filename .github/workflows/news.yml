name: Новини Польща

on:
  schedule:
    # Час у UTC! Польща: влітку UTC+2, взимку UTC+1.
    # Зараз це 07:17, 11:17, 15:17 і 19:17 влітку (06:17, 10:17, 14:17, 18:17 взимку).
    # Хвилина 17, а не 00, бо о рівних годинах GitHub перевантажений і запуски запізнюються.
    - cron: "17 5,9,13,17 * * *"
  workflow_dispatch:  # кнопка «Run workflow» для ручного запуску
    inputs:
      dry_run:
        description: "Тестовий запуск без публікації"
        type: boolean
        default: false

permissions:
  contents: write  # щоб зберігати список опублікованих новин у репозиторії

concurrency:
  group: novyny-polshcha
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Завантажити код
        uses: actions/checkout@v6

      - name: Встановити Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити бібліотеки
        run: pip install -r requirements.txt

      - name: Зібрати й опублікувати новини
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # Назви, які помилково додали у Variables замість Secrets (лише назви, без значень)
          NAMES_IN_VARIABLES: >-
            ${{ vars.TELEGRAM_BOT_TOKEN && 'TELEGRAM_BOT_TOKEN' || '' }}
            ${{ vars.TELEGRAM_CHANNEL && 'TELEGRAM_CHANNEL' || '' }}
            ${{ vars.GEMINI_API_KEY && 'GEMINI_API_KEY' || '' }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      # Лише для тестового запуску: картинки й тексти постів можна скачати
      # внизу сторінки запуску, у блоці Artifacts → preview
      - name: Зберегти приклади постів
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: preview/
          if-no-files-found: ignore
          retention-days: 7

      - name: Зберегти список опублікованих новин
        if: always()
        run: |
          if [ -f data/posted.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/posted.json
            if ! git diff --cached --quiet; then
              git commit -m "Оновлено список опублікованих новин"
              git pull --rebase --autostash
              git push
            fi
          fi
